function editEmo(id){const e=DATA.emotions.find(x=>x.id===id);if(!e)return;window._editEmoId=id;if(e.type==='sweet'){openModal('编辑甜蜜瞬间',`<label class="f">当时心情</label><div class="seg" id="e_mood_seg">${['😊 开心','😘 感动','🤣 搞笑','😌 温馨'].map(m=>`<button data-v="${m.slice(2)}" class="${e.mood===m.slice(2)?'on':''}">${m}</button>`).join('')}</div><input type="hidden" id="e_mood" value="${esc(e.mood||'')}"><label class="f">发生了什么</label><textarea id="e_c">${esc(e.content||'')}</textarea><label class="f">日期</label><input type="date" id="e_d" value="${esc(e.date||todayStr())}"><div class="row-btns"><button class="btn full" onclick="submitEditEmo()">保存</button></div>`);bindSeg('#e_mood_seg','e_mood');}else{openModal('编辑吵架记录',`<label class="f">吵架时间</label><input type="date" id="e_d" value="${esc(e.date||todayStr())}"><label class="f">触发事件简述</label><textarea id="e_trigger">${esc(e.trigger||'')}</textarea><label class="f">毛毛反应</label><div class="seg" id="e_cat">${['🤫 沉默不说话','😠 直接爆发','😌 平静沟通'].map(m=>`<button data-v="${m.slice(2)}" class="${e.catEmotion===m.slice(2)?'on':''}">${m}</button>`).join('')}</div><label class="f">小赵反应</label><div class="seg" id="e_dog">${['🏃 回避矛盾','🛡️ 直面沟通'].map(m=>`<button data-v="${m.slice(2)}" class="${e.dogEmotion===m.slice(2)?'on':''}">${m}</button>`).join('')}</div><label class="f">我的感受</label><textarea id="e_my">${esc(e.myFeeling||'')}</textarea><input type="hidden" id="e_cat_v" value="${esc(e.catEmotion||'')}"><input type="hidden" id="e_dog_v" value="${esc(e.dogEmotion||'')}"><div class="row-btns"><button class="btn full" onclick="submitEditEmo()">保存</button></div>`);bindSeg('#e_cat','e_cat_v');bindSeg('#e_dog','e_dog_v');}}
function submitEditEmo(){const id=window._editEmoId;const e=DATA.emotions.find(x=>x.id===id);if(!e)return;const miss=[];if(e.type==='sweet'){const mood=($('#e_mood')&&$('#e_mood').value)||'';const content=($('#e_c').value||'').trim();const date=$('#e_d').value||'';if(!mood)miss.push('当时心情');if(!content)miss.push('发生了什么');if(!date)miss.push('日期');if(miss.length){toast('请填写：'+miss.join('、'));return;}e.mood=mood;e.content=content;e.date=date;}else{const date=$('#e_d').value||'';const trigger=($('#e_trigger').value||'').trim();const catEmotion=($('#e_cat_v')&&$('#e_cat_v').value)||'';const dogEmotion=($('#e_dog_v')&&$('#e_dog_v').value)||'';const myFeeling=($('#e_my').value||'').trim();if(!date)miss.push('吵架时间');if(!trigger)miss.push('触发事件简述');if(!catEmotion)miss.push('毛毛反应');if(!dogEmotion)miss.push('小赵反应');if(!myFeeling)miss.push('我的感受');if(miss.length){toast('请填写：'+miss.join('、'));return;}e.date=date;e.trigger=trigger;e.catEmotion=catEmotion;e.dogEmotion=dogEmotion;e.myFeeling=myFeeling;}save();closeModal();window._editEmoId=null;renderView();}


/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,view=el.dataset.view,who=el.dataset.who,type=el.dataset.type,status=el.dataset.status,mod=el.dataset.mod;
  switch(a){
    case 'nav':go(view);break;
    case 'sbToggle':toggleSidebar();break;
    case 'closeSidebar':closeSidebar();break;
    case 'switchMe':DATA.meta.me=who;save();renderAll();break;
    case 'closeModal':closeModal();break;
    case 'enterApp':enterApp();break;
    case 'favDailyQuote':{const q=DAILY_QUOTES[dayIdx()%DAILY_QUOTES.length];if(!DATA.favQuotes.includes(q.zh)){DATA.favQuotes.push(q.zh);save();toast('已收藏 🤍');}else toast('已在收藏里啦');break;}
    case 'addAnn':addAnn();break;case 'editAnn':editAnn(id);break;case 'delAnn':del('anniversaries',id,'纪念日');break;
    case 'addGift':addGift();break;case 'editGift':editGift(id);break;case 'delGift':del('gifts',id,'礼物');break;
    case 'addPhoto':$('#photoFile').click();break;case 'delPhoto':del('photos',id,'合影');break;case 'editPhoto':editPhoto(id);break;case 'delPhotoImg':{const p=DATA.photos.find(x=>x.id===id);if(p){let arr=pImgs(p);const i=+el.dataset.idx;arr.splice(i,1);if(!arr.length){if(confirm('这是最后一张，删除后将整条合影记录一并删除，确定吗？')){DATA.photos=DATA.photos.filter(x=>x.id!==id);}}else{p.imgs=arr;p.src=arr[0];}save();renderView();}break;}
    case 'addWish':addWish();break;case 'editWish':editWish(id);break;
    case 'toggleWish':{const w=DATA.wishes.find(x=>x.id===id);if(w)openCheckin(w);break;}
    case 'delWish':del('wishes',id,'许愿');break;
    case 'savePeriod':{DATA.period.cycle=+$('#cycle').value||28;DATA.period.lastStart=$('#lastStart').value;DATA.period.lastEnd=$('#lastEnd').value;
      const fb=$('#feeling').value.trim();if(DATA.period.lastStart){const r=DATA.period.records.find(x=>x.start===DATA.period.lastStart);if(r){r.end=DATA.period.lastEnd;if(fb)r.feeling=fb;}else DATA.period.records.push({start:DATA.period.lastStart,end:DATA.period.lastEnd,feeling:fb,body:""});}
      predictPeriod();save();renderView();renderToday();break;}
    case 'addEmo':addEmo(type);break;
    case 'reconcile':{const e=DATA.emotions.find(x=>x.id===id);if(e){e.status=status;if(status==='ok'){e.reconcileTime=todayStr();}save();renderView();}break;}
    case 'manualEmo':manualEmo(id);break;
    case 'delEmo':del('emotions',id,'记录');break;case 'editEmo':editEmo(id);break;case 'delReview':{const e=DATA.emotions.find(x=>x.id===id);if(e){const k=el.dataset.who;if(e.reviews)e.reviews[k]='';save();renderView();}break;}
    
    case 'addFit':addFit();break;case 'delFit':del('fitness',id,'运动');break;
    case 'addTodo':{const inp=$('#todoInput');if(!inp)return;const v=inp.value.trim();if(!v){toast('先写点什么吧');return;}DATA.todos.unshift({id:uid('t'),text:v,confirmedBy:null,createdAt:todayStr()});inp.value='';save();renderView();break;}
    case 'toggleTodo':{const t=DATA.todos.find(x=>x.id===id);if(t){t.confirmedBy=t.confirmedBy?null:(DATA.meta.me||'cat');save();renderView();}break;}
    case 'delTodo':{DATA.todos=DATA.todos.filter(x=>x.id!==id);save();renderView();break;}case 'editTodo':editTodo(id);break;
    case 'saveMeta':{DATA.meta.startDate=$('#startDate').value;
      const cw=$('#catWeight'),dw=$('#dogWeight');
      if(cw)DATA.meta.cat.weight=Math.max(30,Math.min(150,+$('#catWeight').value||50));
      if(dw)DATA.meta.dog.weight=Math.max(30,Math.min(150,+$('#dogWeight').value||65));
      const mv=$('#m_me_v');if(mv)DATA.meta.me=mv.value;save();renderAll();closeModal();toast('已保存');break;}
    case 'setAvatar':setAvatar(who);break;case 'clrAvatar':clrAvatar(who);break;
    case 'export':exportJSON();break;case 'import':$('#importFile').click();break;
    case 'clearData':clearData();break;case 'clearDemo':clearDemo();break;
    case 'saveSync':{const u=$('#sbUrl'),a=$('#sbAnon'),r=$('#syncRoom');localStorage.setItem('wb_sb_url',(u&&u.value.trim())||'');localStorage.setItem('wb_sb_anon',(a&&a.value.trim())||'');SYNC.room=(r&&r.value.trim())||DATA.sync.roomId;syncSaveCfg();_sb=null;reconnectSync();toast('已连接，实时同步开启 🔗');break;}
    case 'copyRoom':{const r=$('#syncRoom');const v=(r&&r.value.trim())||SYNC.room||DATA.sync.roomId;if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast('房间码已复制：'+v)).catch(()=>toast('房间码：'+v));else toast('房间码：'+v);break;}
    case 'aiReanalyze':AI_VIEW_MONTH=null;toast('正在读你们的故事…');analyzeRelationship();viewAI();toast('已重新分析 ✨');break;
    case 'aiHistory':AI_VIEW_MONTH=el.dataset.month;viewAI();break;
    case 'aiBack':AI_VIEW_MONTH=null;viewAI();break;
  }
});

  <label class="f">送给谁</label><div class="seg" id="g_to"><button data-v="cat" class="${g.toWho==='cat'?'on':''}">给${whoName('cat')}</button><button data-v="dog" class="${g.toWho==='dog'?'on':''}">给${whoName('dog')}</button></div>
  <label class="f">礼物名称<span class="req">*</span></label><input id="g_name" value="${esc(g.name||'')}">
  <label class="f">赠送感受备注</label><textarea id="g_feel">${esc(g.feeling||'')}</textarea>
  <label class="f">礼物图片（可选）</label><input type="file" id="g_file" accept="image/*" onchange="pickGiftPhoto(this)">
  <div id="g_preview" class="gift-prev">${g.photo?`<img src="${g.photo}" alt="预览"><button type="button" class="gift-prev-x" onclick="clearGiftPhoto()">移除</button>`:''}</div>
  <label class="f">日期</label><input type="date" id="g_date" value="${esc(g.date||todayStr())}">
  <input type="hidden" id="g_to_v" value="${g.toWho||me}">
  <div class="row-btns"><button class="btn full" onclick="submitGift()">保存修改</button></div>`);bindSeg('#g_to','g_to_v');}
function submitGift(){const scene=($('#g_scene').value||'').trim();const name=($('#g_name').value||'').trim();const feeling=($('#g_feel').value||'').trim();const date=$('#g_date').value||'';const miss=[];if(!scene)miss.push('节日/场景');if(!name)miss.push('礼物名称');if(!feeling)miss.push('感受备注');if(!date)miss.push('日期');if(miss.length){toast('请填写：'+miss.join('、'));return;}const to=($('#g_to_v')&&$('#g_to_v').value)||DATA.meta.me;
  const obj={scene,name,toWho:to,feeling,photo:window._giftPhoto||null,date};
  if(window._editGiftId){const g=DATA.gifts.find(x=>x.id===window._editGiftId);if(g)Object.assign(g,obj);window._editGiftId=null;}
  else DATA.gifts.push(Object.assign({id:uid('g')},obj));
  window._giftPhoto=null;save();closeModal();renderView();}

function handlePhoto(el){const files=Array.from(el.files||[]);el.value='';if(!files.length)return;
  if(files.length>9){toast('一次最多上传 9 张哦～');files.splice(9);}
  const n=files.length;
  openModal('上传合影',`
   <div id="up_preview" class="up-grid"><div class="up-loading">图片压缩中…</div></div>
   <label class="f">什么时候</label><input type="date" id="p_when" value="${todayStr()}">
   <label class="f">场景备注</label><input id="p_scene" placeholder="如：第一次旅行">
   <label class="f">地点</label>
   <input id="p_place" placeholder="如：西湖边 / 家里客厅">
   <div class="row-btns"><button class="btn full" id="up_save" disabled style="opacity:.5">压缩中…</button></div>`);
  const srcs=new Array(n);let done=0;
  files.forEach((f,i)=>{compress(f,800,src=>{srcs[i]=src;if(++done===n)renderUpPreview(srcs,n);});});
}
function renderUpPreview(srcs,n){
  const wrap=$('#up_preview');if(wrap)wrap.innerHTML=srcs.map(s=>`<div class="up-cell"><img src="${s}" alt=""></div>`).join('');
  const btn=$('#up_save');if(btn){btn.disabled=false;btn.style.opacity='';btn.textContent=`保存 ${n} 张`;btn.setAttribute('onclick','submitPhotos()');}
}
function submitPhotos(){const wrap=$('#up_preview');if(!wrap)return;const imgs=Array.from(wrap.querySelectorAll('img')).map(img=>img.src);
  if(!imgs.length){toast('图片还没准备好');return;}
  const when=$('#p_when').value,scene=$('#p_scene').value,place=$('#p_place').value;
  const t=new Date(),time=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'),up=DATA.meta.me,ts=(when||'')+'T'+time;
  DATA.photos.push({id:uid('p'),imgs,scene,place,when,date:when,time,uploader:up,ts});
  save();closeModal();renderView();}
function editPhoto(id){const p=DATA.photos.find(x=>x.id===id);if(!p)return;window._editPhotoImgs=pImgs(p).slice();
  openModal('编辑合影',`
  <label class="f">现有图片（可删除或继续添加）</label>
  <div id="ep_imgs" class="up-grid"></div>
  <label class="f">继续添加图片（可多选）</label><input type="file" id="ep_add" accept="image/*" multiple onchange="addEditImg(this)">
  <label class="f">场景描述</label><input id="ep_scene" value="${esc(p.scene||'')}" placeholder="如：第一次看海">
  <label class="f">地点</label><input id="ep_place" value="${esc(p.place||'')}" placeholder="如：青岛栈桥">
  <label class="f">日期</label><input type="date" id="ep_when" value="${esc(p.when||'')}">
  <label class="f">时间</label><input type="time" id="ep_time" value="${esc(p.time||'')}">
  <div class="row-btns"><button class="btn full" onclick="submitEditPhoto('${p.id}')">保存修改</button></div>`);
  renderEditImgs();}
function renderEditImgs(){const box=$('#ep_imgs');if(!box)return;
  box.innerHTML=window._editPhotoImgs.map((src,i)=>`<div class="up-cell"><img src="${src}" alt=""><button type="button" class="up-x" onclick="removeEditImg(${i})">×</button></div>`).join('');}
function removeEditImg(i){window._editPhotoImgs.splice(i,1);renderEditImgs();}
function addEditImg(el){const files=Array.from(el.files||[]);el.value='';if(!files.length)return;let n=files.length,done=0;files.forEach(f=>compress(f,800,src=>{window._editPhotoImgs.push(src);if(++done===n)renderEditImgs();}));}
function submitEditPhoto(id){const p=DATA.photos.find(x=>x.id===id);if(!p)return;
  if(!window._editPhotoImgs||!window._editPhotoImgs.length){toast('至少保留一张图片');return;}
  p.imgs=window._editPhotoImgs.slice();p.src=p.imgs[0];
  p.scene=($('#ep_scene').value||'').trim();p.place=($('#ep_place').value||'').trim();p.when=($('#ep_when').value||'');p.time=($('#ep_time').value||'');p.date=p.when;p.ts=(p.when||'')+'T'+(p.time||'00:00');
  window._editPhotoImgs=null;save();closeModal();renderView();}

function addWish(){openModal('添加愿望',`
  <label class="f">愿望标题<span class="req">*</span></label><input id="w_title" placeholder="如：一起看极光">

function submitWish(id){const title=($('#w_title').value||'').trim();const category=$('#w_cat').value||'';const note=($('#w_note')&&$('#w_note').value||'').trim();const miss=[];if(!title)miss.push('愿望标题');if(!category)miss.push('分类');if(miss.length){toast('请填写：'+miss.join('、'));return;}const w=id?DATA.wishes.find(x=>x.id===id):null;if(w){w.title=title;w.category=category;w.note=note;}else DATA.wishes.push({id:uid('w'),title,category,note,status:'todo',doneBy:[],feeling:'',checkins:{},checkin:null,date:''});save();closeModal();renderView();}
function editWish(id){const w=DATA.wishes.find(x=>x.id===id);if(!w)return;openModal('编辑愿望',`
  <label class="f">愿望标题<span class="req">*</span></label><input id="w_title" value="${esc(w.title||'')}">
  <label class="f">分类</label><select id="w_cat">${['旅行','美食','体验','居家','其他'].map(c=>`<option ${c===w.category?'selected':''}>${c}</option>`).join('')}</select>

  <div class="row-btns"><button class="btn full" onclick="submitWish('${w.id}')">保存修改</button></div>`);}
function openCheckin(w){const me=DATA.meta.me;const hasOld=w.checkins&&w.checkins[me];
  openModal('解锁打卡',`<p>「${esc(w.title)}」${hasOld?'更新你的打卡图':'完成啦！上传打卡照（可选），留下感受。'}</p>
  <input type="file" id="w_file" accept="image/*">

  <div class="row-btns"><button class="btn full" onclick="submitCheckin('${w.id}')">${hasOld?'更新打卡':'打卡'}（${whoName(me)}✓）</button></div>`);}
function submitCheckin(id){const w=DATA.wishes.find(x=>x.id===id);if(!w)return;const me=DATA.meta.me;w.checkins=w.checkins||{};if(w.checkin&&!w.checkins[me]){w.checkins[me]=w.checkin;delete w.checkin;}const f=$('#w_file')&&$('#w_file').files[0];

function addEmo(type){
  if(type==='sweet'){openModal('甜蜜瞬间',`    <label class="f">当时心情<span class="req">*</span></label><div class="seg" id="e_mood_seg"><button data-v="开心" class="on">😊 开心</button><button data-v="感动">😘 感动</button><button data-v="搞笑">🤣 搞笑</button><button data-v="温馨">😌 温馨</button></div><input type="hidden" id="e_mood">

    <label class="f">小赵反应<span class="req">*</span></label><div class="seg" id="e_dog"><button data-v="回避" class="on">🏃 回避矛盾</button><button data-v="直面">🛡️ 直面沟通</button></div>

function submitEmo(type){const miss=[];
  if(type==='sweet'){const mood=($('#e_mood')&&$('#e_mood').value)||'';const content=($('#e_c').value||'').trim();const date=$('#e_d').value||'';if(!mood)miss.push('当时心情');if(!content)miss.push('发生了什么');if(!date)miss.push('日期');if(miss.length){toast('请填写：'+miss.join('、'));return;}const base={id:uid('e'),type,archived:false,date,mood,content,photo:null,recorder:DATA.meta.me};DATA.emotions.push(base);}
  else{const date=$('#e_d').value||'';const trigger=($('#e_trigger').value||'').trim();const catEmotion=($('#e_cat_v')&&$('#e_cat_v').value)||'沉默';const dogEmotion=($('#e_dog_v')&&$('#e_dog_v').value)||'回避';const myFeeling=($('#e_my').value||'').trim();if(!date)miss.push('吵架时间');if(!trigger)miss.push('触发事件简述');if(!catEmotion)miss.push('毛毛反应');if(!dogEmotion)miss.push('小赵反应');if(!myFeeling)miss.push('我的感受');if(miss.length){toast('请填写：'+miss.join('、'));return;}const base={id:uid('e'),type,archived:false,date,trigger,catEmotion,dogEmotion,myFeeling,recorder:DATA.meta.me,manualAnalysis:'',status:'notok',reconcileTime:'',reconcileNote:''};DATA.emotions.push(base);}

function manualEmo(id){const e=DATA.emotions.find(x=>x.id===id);if(!e)return;
  e.reviews=e.reviews||{};

   <div class="row-btns"><button class="btn full" onclick="submitManual('${id}')">保存</button></div>`);}
function submitManual(id){const e=DATA.emotions.find(x=>x.id===id);if(e){e.reviews=e.reviews||{};e.reviews[DATA.meta.me]=$('#m_a').value;
  save();closeModal();renderView();}}

function addFit(){const me=DATA.meta.me;openModal('运动打卡',`
  <label class="f">运动类型<span class="req">*</span>（可自定义：游泳/力量训练/跑步…）</label><input id="f_type" list="ft" placeholder="如：跑步" value="跑步" oninput="updateKcalHint()">
  <datalist id="ft"><option value="跑步"><option value="游泳"><option value="力量训练"><option value="瑜伽"><option value="骑行"></datalist>
  <label class="f">谁打卡</label><div class="seg" id="f_who"><button data-v="cat" class="${me==='cat'?'on':''}">${whoName('cat')}</button><button data-v="dog" class="${me==='dog'?'on':''}">${whoName('dog')}</button></div>
  <label class="f">时长（分钟）</label><input type="number" id="f_dur" value="30" oninput="updateKcalHint()">
  <label class="f">日期</label><input type="date" id="f_date" value="${todayStr()}">
  <label class="f">运动感受</label><input id="f_note" placeholder="可选">
  <input type="hidden" id="f_who_v" value="${me}">
  <div class="hint" id="f_kcal_hint" style="text-align:center;color:var(--btn1-d);font-weight:700"></div>
  <div class="row-btns"><button class="btn full" onclick="submitFit()">打卡</button></div>`);bindSeg('#f_who','f_who_v',updateKcalHint);updateKcalHint();}
function submitFit(){const who=($('#f_who_v')&&$('#f_who_v').value)||DATA.meta.me;
  const type=$('#f_type').value||'运动';const duration=+$('#f_dur').value||0;
  const calories=fitCalories(type,duration,who);
  DATA.fitness.push({id:uid('f'),type,who,duration,calories,date:$('#f_date').value,feeling:$('#f_note').value,photo:null});save();closeModal();renderView();}

/* ---------- helpers ---------- */
function bindSeg(sel,store,onChange){const s=$(sel);if(!s)return;const hid=store.startsWith('#')?store:'#'+store;let v=(s.querySelector('button.on')||s.querySelector('button')).dataset.v;const inp=$(hid);if(inp)inp.value=v;
  s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const i=$(hid);if(i)i.value=b.dataset.v;if(onChange)onChange();});}

/* ---------- export / import / clear ---------- */
function exportJSON(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`恋爱小窝备份_${todayStr()}.json`;a.click();toast('已导出');}
function handleImport(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meta)throw 0;
  if(confirm('导入将覆盖当前数据，确定吗？建议先导出备份。')){DATA=d;DATA._demo=false;save();renderAll();toast('导入成功');}}catch(e){alert('文件格式不正确');}};r.readAsText(f);el.value='';}
function clearData(){if(confirm('⚠️ 将清空全部数据且无法恢复！建议先导出备份。确定清空？')){localStorage.removeItem(LS_KEY);DATA=seed();DATA._demo=false;save();renderAll();toast('已清空');}}
function clearDemo(){if(confirm('将清空纪念日、礼物本、合影墙、许愿单、心情记、运动簿的全部记录，确定吗？')){['anniversaries','gifts','photos','wishes','emotions','fitness'].forEach(k=>{if(Array.isArray(DATA[k]))DATA[k]=[];});DATA._demo=false;save();renderAll();toast('示例已清空');}}
function compress(file,maxW,cb){const img=new Image();const r=new FileReader();r.onload=ev=>{img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.82));};img.src=ev.target.result;};r.readAsDataURL(file);}
let toastT;function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(138,108,82,.95);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:80%';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity='0',1600);}

/* ---------- 纪念日到期提醒（顶部 banner，不阻断操作） ---------- */
function checkPopup(){const due=DATA.anniversaries.find(a=>a.date===todayStr()&&!a.seen);if(due){a_seen(due);annivBanner(due);}}
function annivBanner(due){
  let b=document.getElementById('annivBanner');
  if(!b){b=document.createElement('div');b.id='annivBanner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#FBD9E4,#F6E7C8);color:#6b4a3a;font-size:14px;box-shadow:0 4px 14px rgba(58,58,58,.12);transform:translateY(-130%);transition:transform .35s ease;';
    b.innerHTML='<span style="font-size:20px;flex:none">🎉</span><span id="annivTxt" style="flex:1;line-height:1.5"></span><button id="annivClose" style="border:none;background:rgba(255,255,255,.6);color:#6b4a3a;border-radius:999px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;flex:none">×</button>';
    document.body.appendChild(b);
    b.querySelector('#annivClose').onclick=()=>{b.style.transform='translateY(-130%)';};
  }
  b.querySelector('#annivTxt').innerHTML=`今天是 <b>${esc(due.title)}</b>！${due.note?' '+esc(due.note):''}`;
  requestAnimationFrame(()=>{b.style.transform='translateY(0)';});
  clearTimeout(b._t);b._t=setTimeout(()=>{b.style.transform='translateY(-130%)';},9000);
}
function a_seen(a){a.seen=true;save();}


/* ---------- 侧边栏 折叠/展开 ---------- */
function openSidebar(){const sb=document.getElementById('sidebar'),sc=document.getElementById('scrim');if(sb)sb.classList.add('open');if(sc&&window.innerWidth<768)sc.classList.add('show');}
function closeSidebar(){const sb=document.getElementById('sidebar'),sc=document.getElementById('scrim');if(sb)sb.classList.remove('open');if(sc)sc.classList.remove('show');}
function toggleSidebar(){const sb=document.getElementById('sidebar');if(sb&&sb.classList.contains('open'))closeSidebar();else openSidebar();}

/* ---------- 开屏进入 ---------- */
function enterApp(){
  const sp=$('#splash'),app=$('#appShell');
  if(sp){sp.style.opacity='0';setTimeout(()=>{sp.style.display='none';if(app)app.style.display='flex';},300);}
  else if(app)app.style.display='flex';
  load();renderAll();checkPopup();setupPTR();setInterval(homeClockTick,1000);initSync();
  if(window.innerWidth>=768)openSidebar();
}

/* ---------- 下拉刷新 ---------- */
function setupPTR(){
  const ce=document.querySelector('.content');const ptr=document.getElementById('ptr');const pt=document.getElementById('ptrText');if(!ce||!ptr)return;
  let y0=0,pull=0,active=false;
  ce.addEventListener('touchstart',e=>{if(ce.scrollTop<=0){y0=e.touches[0].clientY;active=true;pull=0;}},{passive:true});
  ce.addEventListener('touchmove',e=>{if(!active)return;const dy=e.touches[0].clientY-y0;if(dy>0){pull=dy;ptr.style.height=Math.min(dy,80)+'px';pt.textContent=dy>56?'松开刷新':'下拉刷新';if(e.cancelable)e.preventDefault();}},{passive:false});
  ce.addEventListener('touchend',()=>{if(!active)return;active=false;if(pull>56){ptr.classList.add('loading');pt.textContent='刷新中…';
    setTimeout(()=>{renderAll();toast('已刷新');ptr.classList.remove('loading');ptr.style.height='';pt.textContent='下拉刷新';},450);}else{ptr.style.height='';}pull=0;});
}

/* ---------- 启动 ---------- */
load();syncLoadCfg();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
$('#splashIllust').innerHTML=SPLASH;
function splashDateStr(){
 const now=new Date();return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekday(now)} · 农历${lunarDateStr(now)}`;
}
$('#splashDate').textContent=splashDateStr();
