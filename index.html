<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FDFBFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="恋爱小窝">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 27C7 21 4 16 4 12a5 5 0 0 1 12-2 5 5 0 0 1 12 2c0 4-3 9-12 15z' fill='%23FFF0F3' stroke='%233A3A3A' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<script src="./supabase-js.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);"></script>
<title>甜了么</title>
<style>
:root{
  --bg:#FDFBFA;
  --bg-paper:#FFF8F5;
  --card:#FFFFFF;
  --card-grad:radial-gradient(circle at 28% 18%, rgba(255,220,230,.30), transparent 55%);
  --ink:#3A3A3A;
  --sub:#8A8A8A;
  --line:#F0E6E8;
  --highlight:#FCE8EC;
  --btn1:#E8A5B5;
  --btn1-d:#D68A9D;
  --btn2:#9DBBD5;
  --btn2-d:#85A5C1;
  --bow:#E63950;
  --shadow:0 4px 18px rgba(58,58,58,.07);
  --radius:24px;
  --radius-sm:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;overflow:hidden}
body{background-image:radial-gradient(rgba(232,165,181,.14) 1px,transparent 1px);background-size:24px 24px}
button{font-family:inherit;color:inherit}

/* ===== 开屏欢迎页 ===== */
.splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;animation:splashIn .7s ease}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
.splash-inner{text-align:center;padding:36px 28px 76px;max-width:360px;width:100%;position:relative}
.splash-illust{width:220px;height:150px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:0;padding:0}
.splash-illust svg,.splash-illust img{width:100%;height:100%;object-fit:contain}
.splash-date{font-size:13px;color:var(--sub);margin-bottom:16px}
.splash-greet{font-size:23px;font-weight:800;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.splash-sub{font-size:13px;color:var(--sub);margin-bottom:34px}
.splash-btn{background:linear-gradient(135deg,#FFF0F3 0%,#FCE8EC 40%,#F8D4DC 100%);color:#5A4A4E;border:none;border-radius:999px;padding:15px 58px;font-size:14px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 14px rgba(232,165,181,.30),0 8px 24px rgba(232,165,181,.18);transition:transform .22s,box-shadow .22s,filter .22s}
.splash-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);transition:transform .7s}
.splash-btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(232,165,181,.38),0 12px 30px rgba(232,165,181,.24)}
.splash-btn:hover::before{transform:translateX(100%)}
.splash-btn:active{transform:scale(.97) translateY(0);filter:brightness(.96)}
.splash-bottom{position:absolute;bottom:26px;left:0;right:0;font-size:11px;color:var(--sub);letter-spacing:.2px}

/* ===== 外壳 ===== */
.shell{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ===== 左侧可折叠侧边栏 ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:70px;background:var(--bg-paper);border-right:1.5px dashed var(--line);
  display:flex;flex-direction:column;z-index:40;transition:width .28s cubic-bezier(.4,0,.2,1);overflow:hidden}
.sidebar.open{width:234px;box-shadow:4px 0 24px rgba(107,88,68,.10)}
.sb-toggle{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;border:none;
  background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none;z-index:5;transition:transform .15s}
.sb-toggle:active{transform:scale(.9)}
.sb-toggle svg{width:18px;height:18px;transition:transform .25s}
.sidebar.open .sb-toggle svg{transform:rotate(180deg)}
.sb-user{padding:54px 10px 14px;text-align:center;border-bottom:1.5px dashed var(--line);flex:none}
.sb-avatar{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;border:none;box-shadow:none}
.sb-avatar svg{width:40px;height:40px}
.sb-avatar img{width:100%;height:100%;object-fit:cover}
.sb-name{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .22s}
.sb-sign{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;opacity:0;transition:opacity .22s}
.sidebar.open .sb-name,.sidebar.open .sb-sign{opacity:1}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px 6px;display:flex;flex-direction:column;gap:5px}
.nav::-webkit-scrollbar{width:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 9px;border-radius:var(--radius-sm);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .18s,transform .12s}
.nav-item:active{transform:scale(.96)}
.nav-item.active{background:rgba(252,232,236,.45)}
.nav-item .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;background:transparent;border:none;box-shadow:none}
.nav-item .ic svg{width:24px;height:24px}
.nav-item .ic img{width:30px;height:30px;object-fit:contain}
.nav-item .lab{font-size:13px;font-weight:700;opacity:0;transition:opacity .2s}
.sidebar.open .nav-item .lab{opacity:1}
.sb-foot{padding:10px 8px 14px;border-top:1.5px dashed var(--line);flex:none}
.sb-foot .nav-item{background:transparent}
.sb-foot .nav-item .lab{opacity:1}
.scrim{position:fixed;inset:0;background:rgba(107,88,68,.30);opacity:0;visibility:hidden;transition:.22s;z-index:35}
.scrim.show{opacity:1;visibility:visible}

/* ===== 内容区 ===== */
.content{margin-left:70px;flex:1;min-width:0;height:100vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.content-inner{max-width:520px;width:100%;margin:0 auto;padding:0 14px 96px;position:relative}
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:12px;transition:height .2s}
.ptr .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--btn1);border-radius:50%;display:none;animation:spin .7s linear infinite}
.ptr.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 统一页面头部 ===== */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 4px 8px;margin-bottom:4px}
.ph-left{display:flex;align-items:center;gap:10px;min-width:0}
.ph-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;background:transparent;border:none;box-shadow:none}
.ph-icon svg{width:26px;height:26px}
.ph-icon img{width:30px;height:30px;object-fit:contain}
.ph-title{font-size:17px;font-weight:800;color:var(--ink);line-height:1.25}
.ph-slogan{font-size:11px;color:var(--sub);margin-top:2px}

/* ===== 卡片体系 ===== */
.card{position:relative;background:var(--card) var(--card-grad);border-radius:var(--radius);padding:16px 15px;box-shadow:var(--shadow);
  margin-bottom:14px;border:1px solid rgba(226,212,192,.55)}
.card::before{content:"";position:absolute;left:14px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--btn2);opacity:.55}
.card-corner{position:absolute;right:10px;bottom:8px;width:34px;height:34px;opacity:.22;pointer-events:none;z-index:1}
.card h2{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);padding-left:16px}
.card h2 svg{width:22px;height:22px;flex:none}
.card h2 img{width:22px;height:22px;object-fit:contain;flex:none;border-radius:5px}
.card h2 .h-deco{width:20px;height:20px;margin-left:auto;opacity:.5;flex:none}

/* ===== 首页双人卡 ===== */
.topbar{padding:0 2px 4px}
.couples{display:flex;gap:10px}
.partner{flex:1;background:var(--card) var(--card-grad);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;cursor:pointer;border:1.5px solid transparent;min-width:0;transition:border-color .2s,transform .12s,box-shadow .25s;position:relative;animation:float 3s ease-in-out infinite}
.partner:nth-child(2){animation-delay:.6s}
.partner:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(232,165,181,.22)}
.partner:active{transform:scale(.98)}
.partner.is-me{border-color:var(--btn1)}
.partner .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partner .zs{font-size:11px;color:var(--sub)}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;border:none}
.avatar svg{width:40px;height:40px}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ===== 核心信息 ===== */
.core{position:relative;background:var(--card) var(--card-grad);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);margin:12px 0;text-align:center;overflow:hidden;border:1.5px dashed var(--btn1)}
.core::before{background:var(--btn1);opacity:.45}
.core .big{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.core .sub2{font-size:11px;color:var(--sub);margin-top:2px}
.countdown{display:inline-flex;align-items:baseline;gap:4px;margin-top:6px;font-size:12px;color:var(--sub)}
.countdown b{font-size:18px;color:var(--btn1-d);font-weight:800}

/* ===== 今天要处理 ===== */
.today{background:var(--card) var(--card-grad);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px;border:1.5px solid rgba(226,212,192,.55)}
.today h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink);padding-left:16px}
.today .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.today .row:first-of-type{border-top:none}
.today .txt{flex:1;font-size:13px;min-width:0}
.today .txt small{color:var(--sub);display:block;font-size:11px}
.over{color:#c98b86!important;font-weight:700}

/* ===== 按钮 ===== */
.btn{border:none;border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;background:var(--btn1);color:#fff;box-shadow:var(--shadow);min-height:46px;transition:transform .12s,filter .15s;position:relative}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.ghost{background:var(--bg-paper);color:var(--ink);border:1.5px dashed var(--line)}
.sheet input[type=file]{display:block;width:100%;margin:8px 0 4px;padding:10px 12px;font-size:13px;color:var(--sub);background:var(--bg-paper);border:1.5px dashed var(--line);border-radius:12px;cursor:pointer}
.sheet input[type=file]::file-selector-button{margin-right:10px;padding:6px 12px;border:none;border-radius:999px;background:#E8A5B5;color:#fff;font-size:12px;cursor:pointer}
.btn.dog{background:var(--btn1)}
.btn.mini{padding:7px 12px;font-size:12px;min-height:38px;border-radius:11px}
.btn.full{width:100%}
.btn.red{background:#d4a096}
.btn.green{background:var(--btn2)}
.btn.star{background:#f8ece0;color:#a5825c;border:1.5px dashed var(--btn1)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.row-btns .btn{flex:1}
.tape-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--highlight);color:var(--ink)}

/* ===== 表单 ===== */
label.f{display:block;margin:10px 0 4px;font-size:12px;color:var(--sub);font-weight:700}
input,select,textarea{width:100%;padding:11px 12px;font-size:16px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);background:#fffdf8;color:var(--ink);outline:none;font-family:inherit;transition:border-color .18s}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--btn1);border-style:solid}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1.5px dashed var(--line);background:#fffdf8;border-radius:var(--radius-sm);padding:10px;font-size:13px;cursor:pointer;min-height:46px;color:var(--ink);transition:.15s}
.seg button.on{background:var(--btn1);color:#fff;border-color:var(--btn1)}

/* ===== 条目 ===== */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:none}
.item .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none;background:transparent;border:none;box-shadow:none;font-size:22px}
.item .ic svg{width:24px;height:24px;color:var(--ink)}
.item .ic img{width:24px;height:24px;object-fit:contain}
.item .body{flex:1;min-width:0}
.item .body .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .body .s{font-size:11px;color:var(--sub)}
.tag{font-size:10px;padding:2px 10px;border-radius:999px;background:var(--bg-paper);color:var(--ink);font-weight:700;display:inline-block;border:1px dashed var(--line)}
.tag.green{background:#eef3e6;color:#5f7a50}
.tag.red{background:#f5e4e1;color:#a35e58}
.tag.yellow{background:#f8f0e0;color:#8a6a30}
.tag.cat{background:#fbeef0;color:#a5727a}
.tag.dog{background:#eaf4f0;color:#4f8b7c}
.thumb{width:54px;height:54px;border-radius:13px;object-fit:cover;flex:none;background:var(--bg-paper)}
.gift-prev{margin:8px 0;min-height:0}
.gift-prev img{width:96px;height:96px;object-fit:cover;border-radius:13px;display:block;border:1px dashed var(--line)}
.gift-prev-x{margin:6px 0 0;padding:3px 10px;border:1px solid var(--line);background:var(--bg-paper);border-radius:999px;font-size:10px;color:var(--sub);cursor:pointer}
.act{display:flex;gap:6px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:13px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:transform .12s,background .15s}.iconbtn:hover{background:rgba(58,58,58,.06)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{transform:scale(.9)}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(107,88,68,.42);display:none;align-items:flex-end;z-index:50;padding:0}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -6px 24px rgba(107,88,68,.16);position:relative}
.sheet h3{margin:0 0 12px;font-size:16px;color:var(--ink);font-weight:800;padding-top:6px}
.sheet .close{position:absolute;right:14px;top:14px;background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
.banner{background:var(--highlight);color:var(--ink);font-size:12px;padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.big-num{font-size:20px;font-weight:800;color:var(--ink)}
.bar{height:11px;border-radius:999px;background:var(--bg-paper);overflow:hidden;margin-top:4px;border:1px dashed var(--line)}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
.empty{padding:24px;text-align:center;color:var(--sub)}
.modal-tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);width:90px;height:20px;background:repeating-linear-gradient(45deg,var(--btn1),var(--btn1) 6px,#fff8 6px,#fff8 12px);border-radius:4px;opacity:.85;box-shadow:0 1px 3px rgba(107,88,68,.12)}


/* ===== 合照墙瀑布流 ===== */
.waterfall{column-count:2;column-gap:8px;margin-bottom:8px}
.ph{break-inside:avoid;background:var(--card) var(--card-grad);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;position:relative;box-shadow:var(--shadow);border:1.5px solid rgba(226,212,192,.55)}
.ph img{width:100%;display:block}
.tl-date{font-size:12px;font-weight:800;color:var(--ink);margin:10px 0 6px;padding-left:8px;border-left:4px solid var(--btn1)}

/* ===== 加载态 ===== */
.btn.loading{position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* ===== 快捷导航 ===== */
.navlist{display:flex;flex-direction:column;gap:8px}
.navrow{display:flex;align-items:center;gap:10px;background:var(--card) var(--card-grad);border-radius:var(--radius-sm);padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;border:1px solid rgba(226,212,192,.55);transition:transform .12s;position:relative}
.navrow:active{transform:scale(.98)}
.navrow .ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none;background:transparent;border:none;box-shadow:none}
.navrow .ic svg{width:24px;height:24px;color:var(--ink)}
.navrow .nm{flex:1;font-weight:700;font-size:14px}
.navrow .ar{color:var(--sub)}

/* ===== 大屏 ===== */
@media(min-width:768px){.sidebar.open ~ .content{margin-left:234px}}

/* ===== 首页高级交互 ===== */
.home-hero,.quote-card,.anni-card,.fortune-card{position:relative;background:var(--card) var(--card-grad);border-radius:var(--radius);padding:16px 15px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(226,212,192,.55);transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease}
.home-hero{background:linear-gradient(135deg,#FFF8F5 0%,#FFF0F3 55%,#FCE8EC 100%);background-size:200% 200%;animation:gradientBG 10s ease infinite;overflow:visible}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.home-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-100%);transition:transform .8s;pointer-events:none}
.home-hero:hover::before{transform:translateX(100%)}
.hh-title{font-size:18px;font-weight:800;color:var(--ink);line-height:1.2;display:flex;align-items:center;gap:6px}.hh-title img,.hh-title svg{width:22px;height:22px;object-fit:contain;flex:none}
.hh-date{font-size:11px;color:var(--sub);margin-top:3px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hh-pill{display:inline-flex;align-items:center;gap:5px;margin:14px 0 8px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.55);border:1.5px dashed var(--line);font-size:11px;font-weight:700;color:var(--ink);backdrop-filter:blur(4px)}
.hh-greet{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:3px}
.hh-sub{font-size:13px;color:var(--sub);margin-bottom:12px}
.hh-clock{font-size:clamp(38px,12vw,54px);font-weight:300;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);margin:4px 0 8px}
.hh-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);flex-wrap:wrap;gap:4px}
.hh-bottom span{white-space:nowrap}
.hh-deco{position:absolute;right:-8px;bottom:-16px;width:90px;height:90px;opacity:.10;pointer-events:none;animation:float 5s ease-in-out infinite;z-index:1}
.quote-card{overflow:hidden}
.qc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qc-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800}
.qc-tag{background:var(--bg-paper);border:1.5px dashed var(--line);border-radius:999px;padding:3px 9px;font-size:10px;color:var(--sub);font-weight:700}
.qc-zh{font-size:15px;font-weight:700;line-height:1.7;margin-bottom:6px;color:var(--ink)}

.anni-card{padding:18px 15px}
.ac-top{text-align:center;margin-bottom:14px}
.ac-big{font-size:29px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.ac-sub{font-size:11px;color:var(--sub);margin-top:2px}
.ac-list{display:flex;flex-direction:column;gap:9px}
.ac-item{display:flex;align-items:center;gap:11px;background:var(--bg-paper);border-radius:var(--radius-sm);padding:10px 12px;border:1.5px dashed var(--line);cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s}

.ac-day{display:flex;flex-direction:column;align-items:center;min-width:42px}

.ac-info{flex:1;min-width:0}
.ac-name{font-weight:800;font-size:13px;color:var(--ink)}
.ac-date{font-size:10px;color:var(--sub)}
.ac-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(58,58,58,.08);font-size:16px}
.fortune-card{padding-bottom:14px}.fortune-card h2{margin:0 0 12px;display:flex;align-items:center;gap:8px}.fortune-card h2 svg,.fortune-card h2 img{width:22px;height:22px;flex:none;border-radius:5px}
.hh-ic,.fc-ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.hh-ic svg,.fc-ic svg{width:20px;height:20px}
.hh-tag{position:absolute;top:16px;right:14px;background:var(--bg-paper);border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:10px;font-weight:700;color:var(--sub)}
.fc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.fortune-card h2,.fortune-card .fc-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--ink)}.fc-title svg,.fc-title img{width:22px;height:22px;flex:none}
.fc-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--ink)}.fc-title svg,.fc-title img{width:22px;height:22px;flex:none}
.fc-tag{background:var(--bg-paper);border:1.5px dashed var(--line);border-radius:999px;padding:3px 9px;font-size:10px;color:var(--sub);font-weight:700}
.fc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fc-panel{background:var(--bg-paper);border-radius:var(--radius-sm);padding:12px;border:1.5px dashed var(--line);transition:transform .2s,box-shadow .2s}
.fc-panel:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(58,58,58,.08)}
.fc-sign{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;margin-bottom:10px;color:var(--ink)}
.fc-row{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:11px;line-height:1.5;color:var(--ink)}
.fc-row .cat{flex:none;background:var(--highlight);border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap}
.todo-card{position:relative;background:var(--card) var(--card-grad);border-radius:var(--radius);padding:16px 15px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(226,212,192,.55)}
.td-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.td-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--ink)}
.td-title img{width:22px;height:22px;object-fit:contain;border-radius:5px;flex:none}
.td-count{font-size:11px;color:var(--sub);background:var(--bg-paper);border:1.5px dashed var(--line);border-radius:999px;padding:3px 9px;font-weight:700}
.td-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.td-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:var(--radius-sm);border:1px solid rgba(226,212,192,.4);transition:opacity .2s,background .2s}
.td-item.done{opacity:.65;background:#f8f8f8}
.td-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:all .2s}
.td-check.checked{background:linear-gradient(135deg,#FFB6C1,#FFA07A);border-color:#FF8FA3;color:#fff}
.td-check svg{width:12px;height:12px}
.td-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
.td-item.done .td-text{text-decoration:line-through;color:var(--sub)}
.td-main{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.td-tag{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
.td-tag.cat{background:#FFF0F3;color:#D84A6B;border:1px solid #F5C6D0}
.td-tag.dog{background:#FDF6E3;color:#A87B3B;border:1px solid #F0DEB0}
.td-add{display:flex;gap:8px}
.td-add input{flex:1;border:1.5px dashed var(--line);border-radius:999px;padding:9px 14px;background:var(--bg-paper);font-size:13px;color:var(--ink);outline:none}
.td-add input:focus{border-color:#E8A5B5;background:#fff}
.td-add .btn{padding:9px 14px;border-radius:999px}
.quick-chips{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick-chips::-webkit-scrollbar{display:none}
.qchip{scroll-snap-align:start;flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px dashed var(--line);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,background .15s}
.qchip:hover{background:var(--bg-paper)}
.qchip:active{transform:scale(.95)}
.qchip .ic{display:flex;align-items:center;justify-content:center;width:22px;height:22px}
.qchip .ic svg,.qchip .ic img{width:20px;height:20px;object-fit:contain}
.home-hero,.quote-card,.anni-card,.fortune-card,.todo-card{animation:homeIn .6s cubic-bezier(.2,.8,.2,1) both;opacity:0}
.home-hero{--i:0}.quote-card{--i:1}.anni-card{--i:2}.fortune-card{--i:3}.todo-card{--i:3.5}
@keyframes homeIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:380px){.fc-grid{grid-template-columns:1fr}.hh-clock{font-size:34px}}

/* ===== UI 优化：语义标签 / 模块增强（沿用 Kitty 配色） ===== */
.tag.warn{background:#FBF0E0;color:#A5742E;border-color:#F0DFBE}
.tag.info{background:#E9EAFB;color:#5B57B0;border-color:#D6D8F2}
.tag.today{background:#FCE8EC;color:#C76A86;border-color:#F4CBD6}
.tag.ok{background:#EAF3E0;color:#5F7A50;border-color:#D6E7C8}
.f .req{color:#D4688A;margin-left:2px}
.hint{font-size:10px;color:var(--sub);margin-top:4px;line-height:1.5}

/* 摘要 / 进度条 */
.sum-bar{display:flex;align-items:center;gap:8px;background:var(--bg-paper);border-radius:999px;padding:8px 12px;margin:6px 0 12px;border:1.5px dashed var(--line);font-size:11px;color:var(--ink);font-weight:700}
.sum-bar .bar{flex:1;margin:0}
.unlock-prog{position:relative;background:linear-gradient(135deg,#FFF8F5 0%,#FDF0F3 50%,#FFF5F7 100%);border-radius:var(--radius-md);padding:16px 15px 14px;margin:6px 0 14px;border:1px solid rgba(232,165,181,.45);box-shadow:0 8px 24px rgba(232,165,181,.18),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden}
.unlock-prog.complete{background:linear-gradient(135deg,#FFFBF5 0%,#FFF7ED 50%,#FFF9F2 100%);border-color:rgba(232,181,120,.55);box-shadow:0 10px 28px rgba(232,181,120,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.up-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.15) 52%,transparent 70%);transform:translateX(-100%);animation:upShine 5s ease-in-out infinite}
@keyframes upShine{0%,100%{transform:translateX(-100%)}50%,70%{transform:translateX(100%)}}
.up-top{position:relative;display:flex;align-items:center;gap:11px;z-index:1}
.up-lock{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;border-radius:50%;box-shadow:0 4px 12px rgba(232,165,181,.28);flex:none}
.unlock-prog.complete .up-lock{box-shadow:0 4px 14px rgba(232,181,120,.35);animation:lockPulse 2s ease-in-out infinite}
@keyframes lockPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.up-meta{flex:1;min-width:0}
.up-t{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.2px}
.unlock-prog.complete .up-t{color:#A67C38}
.up-s{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.45}
.up-s b{color:var(--btn1-d);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.unlock-prog.complete .up-s b{color:#C78D45}
.up-pct{font-size:23px;font-weight:900;color:var(--btn1-d);flex:none;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:flex-start;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(232,165,181,.25)}
.up-pct small{font-size:12px;font-weight:800;margin-top:3px;margin-left:1px}
.unlock-prog.complete .up-pct{color:#C78D45;text-shadow:0 2px 10px rgba(232,181,120,.3)}
.up-pct.dim{font-size:13px;font-weight:800;opacity:.5;letter-spacing:0;text-shadow:none}
.up-pct.dim small{font-size:10px;margin-top:2px}
.up-bar{position:relative;height:13px;border-radius:999px;background:rgba(255,255,255,.85);overflow:hidden;margin:13px 0 9px;box-shadow:inset 0 1px 3px rgba(58,58,58,.08);z-index:1}
.up-bar>i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#F9B8CD 0%,#F4A9C4 40%,#EC8FA8 100%);box-shadow:0 0 12px rgba(236,143,168,.35)}
.up-bar>i.glow{background:linear-gradient(90deg,#FBD89E 0%,#F8C87D 35%,#F4B661 70%,#E8A94E 100%);box-shadow:0 0 16px rgba(244,182,97,.45);animation:barGlow 2s ease-in-out infinite}
@keyframes barGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
.up-bar>i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);transform:translateX(-100%);animation:barShimmer 2.2s ease-in-out infinite}
.up-bar>i.glow::after{animation-duration:1.6s}
@keyframes barShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.up-foot{position:relative;font-size:11.5px;color:var(--sub);text-align:center;line-height:1.55;z-index:1}
.unlock-prog.complete .up-foot{color:#A67C38;font-weight:700}
.up-badge{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#FBD89E,#F4B661);color:#7A5218;font-size:10px;font-weight:900;padding:5px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(232,181,120,.35);animation:badgePop .55s cubic-bezier(.2,.8,.2,1) both;z-index:2}
@keyframes badgePop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.up-decor{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 70%);pointer-events:none;z-index:0}
.up-decor.a{top:-20px;right:-18px}.up-decor.b{bottom:-22px;left:-16px;width:55px;height:55px}

/* 许愿单项卡片 */
/* 愿望清单 设计升级 */
.wish-item{display:block;padding:0;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(135deg,#FFFCFB,#FFF9F7);margin-bottom:12px;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.wish-item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(232,165,181,.12);border-color:rgba(232,165,181,.4)}
.wish-item.done{background:linear-gradient(135deg,#FAFDF7,#F7FAF3);border-color:#D6E7C8}
.wish-item.done:hover{box-shadow:0 6px 18px rgba(143,178,120,.12);border-color:#C4D9B2}
.wi-body{padding:12px 13px 13px}
.wi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.wi-t{font-size:16px;font-weight:800;color:var(--ink);line-height:1.35;flex:1;min-width:0}
.wish-item.done .wi-t{text-decoration:line-through;opacity:.6}
.wi-note{margin-top:5px;font-size:12.5px;color:var(--sub);line-height:1.5}
.wi-cat{margin-top:8px}
.wi-slots{display:flex;gap:8px;margin-top:10px}
.wi-slot{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;padding:7px 6px;border-radius:10px;background:var(--bg-paper);border:1px dashed var(--line);color:var(--sub)}
.wi-slot.on{background:linear-gradient(135deg,#EAF3E0,#E2EDD6);border:1px solid #D6E7C8;color:#5F7A50}
.wi-checkins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wi-checkins .wi-checkin{width:100%;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:0;display:block}
.wi-feel{margin-top:10px;background:var(--bg-paper);border-radius:10px;padding:8px 11px;border:1px dashed var(--line);color:var(--ink);font-size:12.5px;line-height:1.55}
.wi-act{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.wi-act-status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.wi-act-btns{display:flex;align-items:center;gap:8px;flex:none}
.wi-act .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--bg-paper);box-shadow:0 1px 4px rgba(58,58,58,.06);display:flex;align-items:center;justify-content:center}
.wi-act .iconbtn:hover{background:#fff;box-shadow:0 3px 8px rgba(58,58,58,.1)}
.wi-act .iconbtn.wi-check{background:linear-gradient(135deg,#EAF3E0,#E2EDD6);color:#5F7A50;border:1px solid #D6E7C8}
.wi-act .iconbtn.wi-check:hover{background:#fff;box-shadow:0 3px 8px rgba(95,122,80,.15)}

/* 纪念日倒计时项 */
.anni-item{display:flex;align-items:flex-start;gap:14px;background:var(--bg-paper);border-radius:var(--radius-sm);padding:9px 10px;border:1.5px dashed var(--line);margin-bottom:9px;transition:transform .18s,background .18s,box-shadow .18s}
.anni-item:hover{transform:translateY(-2px);background:#fff;box-shadow:0 6px 16px rgba(58,58,58,.08)}
.anni-item .ad{display:flex;align-items:center;justify-content:center;gap:2px;width:48px;flex:none;padding-top:2px}
.anni-item .ad b{font-size:22px;font-weight:800;color:var(--btn1-d);line-height:1;white-space:nowrap}
.anni-item .ad span{font-size:10px;color:var(--sub);white-space:nowrap}
.anni-item .ab{display:flex;flex-direction:column;justify-content:center;gap:3px;flex:1;min-width:0}
.anni-item .title-row{display:block;margin-bottom:4px}
.anni-item .title-main{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%}
.anni-item .title-main .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.anni-item .title-main .ic img,.anni-item .title-main .ic svg{width:18px;height:18px;object-fit:contain}
.anni-item .t{flex:1 1 auto;min-width:0;margin:0;font-weight:700;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anni-item .title-main .t{display:block;white-space:normal;word-break:break-word;overflow:visible;text-overflow:clip;min-width:0;line-height:1.35}
.anni-item .title-row .tag{display:inline-block;margin-top:4px;white-space:nowrap}
.anni-item .act{flex-direction:column;gap:6px;justify-content:flex-start;padding-left:4px}
.anni-item .act .iconbtn{width:32px;height:32px;border-radius:10px}

/* 情感双入口 */
.emo-entry{display:flex;gap:10px;margin:4px 0 14px}
.emo-sweet,.emo-fight{flex:1;border-radius:var(--radius-sm);padding:18px 12px;text-align:center;cursor:pointer;border:none;font-weight:800;font-size:14px;color:#fff;box-shadow:var(--shadow);transition:transform .12s,filter .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.emo-sweet{background:linear-gradient(135deg,#FBD3E0,#F4A9C4)}
.emo-fight{background:linear-gradient(135deg,#C9C2F2,#A7C6EC)}
.emo-sweet:active,.emo-fight:active{transform:scale(.97);filter:brightness(.97)}
.emo-entry .ic{font-size:23px;line-height:1}

/* 设置头像并列 */
.set-av{display:flex;gap:12px;margin:4px 0 6px}
.set-av>div{flex:1;min-width:0}
.set-av .lab2{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:8px}
.set-av .box{aspect-ratio:1;border-radius:var(--radius-sm);border:2px dashed var(--btn1);background:var(--bg-paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--btn1-d);overflow:hidden;min-height:96px}
.set-av .box img{width:100%;height:100%;object-fit:cover}
.set-av .rm{text-align:center;margin-top:6px}
.set-save{margin-top:6px}

/* 健身统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.stat-card{background:var(--bg-paper);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;border:1.5px dashed var(--line)}
.stat-card .n{font-size:16px;font-weight:800;color:var(--btn1-d);line-height:1}
.stat-card .l{font-size:10px;color:var(--sub);margin-top:4px}

/* 健身：双人分区统计 */
.fit-stats{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.fit-person{position:relative;border-radius:var(--radius);padding:12px 14px 13px;background:var(--bg-paper);border:1px solid var(--line);overflow:hidden}
.fit-person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.fit-person.cat{background:linear-gradient(120deg,#fff5f8,#fffdfb)}
.fit-person.cat::before{background:linear-gradient(#F4A9C4,#F7B8CF)}
.fit-person.dog{background:linear-gradient(120deg,#f3faf6,#fdfffb)}
.fit-person.dog::before{background:linear-gradient(#9EC7C0,#B7D6CF)}
.fp-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.fp-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.fit-person.cat .fp-ava{background:#FCE3EC;box-shadow:0 2px 6px #f4a9c455}
.fit-person.dog .fp-ava{background:#E3F1EC;box-shadow:0 2px 6px #9ec7c055}
.fp-name{font-size:14px;font-weight:800;color:var(--ink)}
.fp-sub{font-size:10px;color:var(--sub);margin-left:auto;font-weight:600}
.fit-person.cat .fp-sub{color:#C97B8B}
.fit-person.dog .fp-sub{color:#5F7A6F}
.fp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fp-cell{background:#fff;border-radius:var(--radius-sm);border:1px solid var(--line);padding:9px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.fit-person.cat .fp-cell .n{color:#D96E92}
.fit-person.dog .fp-cell .n{color:#4F8B7C}
.fp-cell .n{font-size:18px;font-weight:800;line-height:1}
.fp-cell .u{font-size:10px;color:var(--sub);font-weight:600;margin-left:1px}
.fp-cell .l{font-size:10px;color:var(--sub);margin-top:4px}
@media (max-width:360px){.fp-cell .n{font-size:15px}.fp-cell .l{font-size:10px}}

/* 经期预测卡 */
.pred-card{background:linear-gradient(135deg,#FFF6F0,#FCE8EC);border-radius:var(--radius-sm);padding:16px;margin:6px 0 14px;border:1.5px dashed var(--btn1);text-align:center}
.pred-card .cap{font-size:11px;color:var(--sub);margin-bottom:4px}
.pred-card .big{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:.5px}

.history-card[open] .arrow{transform:rotate(180deg)}
.history-body{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);text-align:left}

/* 合照墙空状态 */
.ph-empty{text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:var(--radius-sm);background:var(--bg-paper);color:var(--sub);margin:6px 0 12px}

/* ===== 专业视觉精修层（仅改呈现，保留 Kitty 图标与全部业务逻辑） ===== */
:root{
  --shadow-soft:0 8px 26px rgba(58,58,58,.07);
  --shadow-lift:0 14px 34px rgba(58,58,58,.11);
  --ring:0 0 0 4px rgba(232,165,181,.20);
  --radius-md:18px;
}
body{background-image:radial-gradient(rgba(232,165,181,.07) 1px,transparent 1px)}

/* 卡片：更柔和的分层阴影 + 悬浮微抬升 */
.card,.home-hero,.quote-card,.anni-card,.fortune-card,.todo-card{
  box-shadow:var(--shadow-soft);
  transition:box-shadow .3s ease, transform .3s ease;
}
.card:hover,.anni-card:hover,.fortune-card:hover,.todo-card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.home-hero{box-shadow:var(--shadow-soft)}

/* 表单：聚焦更有层次感 */
input,select,textarea{border-radius:var(--radius-md);transition:border-color .2s, box-shadow .2s, background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--btn1);border-style:solid;box-shadow:var(--ring);background:#fff}
.seg button{transition:background .15s, border-color .15s, transform .12s}
.seg button:not(.on):hover{background:#fff;border-color:var(--btn1)}
.seg button.on:hover{background:var(--btn1);color:#fff}

/* 按钮：悬浮微抬升 + 更顺滑 */
.btn{transition:transform .14s ease, filter .16s ease, box-shadow .25s ease}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03);box-shadow:var(--shadow-lift)}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.ghost:hover{background:var(--highlight)}

/* 列表项：悬浮高亮反馈 */
.item{transition:background .16s ease, transform .16s ease}
.item:hover{background:rgba(252,232,236,.22)}

/* 情感双入口按钮：悬浮质感 */
.emo-sweet,.emo-fight{transition:transform .14s ease, filter .16s ease, box-shadow .25s ease}
.emo-sweet:hover,.emo-fight:hover{transform:translateY(-2px);filter:brightness(1.03);box-shadow:var(--shadow-lift)}
.emo-sweet:active,.emo-fight:active{transform:scale(.97);filter:brightness(.97)}

/* 标签：轻悬浮 */
.tag{transition:transform .12s ease, box-shadow .2s ease}
.tag:hover{transform:translateY(-1px)}

/* 合照墙：图片悬浮放大 */
.ph img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ph:hover img{transform:scale(1.04)}
.ph{transition:box-shadow .25s ease, transform .25s ease}
.ph:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}

/* 弹窗：顶部抓手 + 背景模糊 + 进场动画 */
.overlay{background:rgba(58,40,46,.30);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(58,58,58,.18);animation:sheetUp .34s cubic-bezier(.2,.8,.2,1) both}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:999px;background:rgba(58,58,58,.14)}
.sheet h3{padding-top:16px}
@keyframes sheetUp{from{transform:translateY(48px);opacity:.55}to{transform:none;opacity:1}}

/* 空状态：更精致的留白与插画感 */
.ph-empty{display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line);background:linear-gradient(135deg,var(--bg-paper),#FFFDFB)}
.ph-empty .cam{font-size:41px;filter:drop-shadow(0 5px 10px rgba(232,165,181,.35))}
.empty{padding:36px 16px;color:var(--sub);font-size:13px;line-height:1.6}

/* 页面头部：更通透的呼吸感 */
.page-header{padding:18px 4px 10px}
.ph-title{letter-spacing:.3px}

/* 设置页：体重自定义 */
.weight-row{display:flex;gap:10px}
.weight-row>div{flex:1;min-width:0}
.weight-row .wl{font-size:11px;color:var(--sub);text-align:center;margin-bottom:5px;font-weight:700}

/* 快捷入口 chip：悬浮轻反馈 */
.qchip,.navrow,.ac-item{transition:transform .16s ease, box-shadow .2s ease, background .18s ease}
.qchip:hover,.navrow:hover{background:var(--bg-paper);transform:translateY(-1px)}

.sync-status{font-size:12.5px;font-weight:800;padding:9px 12px;border-radius:var(--radius-sm);margin:4px 0 12px;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.sync-status.on{background:linear-gradient(135deg,#F1F8F1,#EAF6EC);color:#3F8A5B;border-color:rgba(63,138,91,.3)}
.sync-status.off{background:linear-gradient(135deg,#FFF6F6,#FDEEF0);color:#C46A7A;border-color:rgba(196,106,122,.3)}

/* ===== 移动端自适应（iPhone 14 / 华为 Mate 60 等 ≤480px 手机） ===== */
@media (max-width:480px){
  /* 顶部避开刘海/状态栏，底部避开 Home 指示条 */
  .content{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left)}
  .content-inner{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .sidebar{padding-top:env(safe-area-inset-top)}
  .sb-toggle{top:max(12px,env(safe-area-inset-top))}
  .sb-user{padding-top:max(54px,calc(env(safe-area-inset-top) + 42px))}

  /* 输入框：触摸友好尺寸，且统一 ≥16px 防止 iOS 聚焦时自动放大 */
  input,select,textarea{font-size:14px;padding:12px 14px;min-height:46px}
  .td-add input{font-size:14px;min-height:44px}
  .weight-wrap input{font-size:14px}
  .sheet input[type=file]{font-size:13px}

  /* 侧边栏在手机上收窄，把空间留给内容 */
  .sidebar{width:60px}
  .content{margin-left:60px}
  .sidebar.open{width:228px}
  .sb-avatar{width:46px;height:46px}
  .sb-avatar svg{width:36px;height:36px}
  .nav-item .ic{width:36px;height:36px}
  .nav-item .ic img{width:26px;height:26px}

  /* 首页双人卡 / 头像收紧间距 */
  .couples{gap:8px}
  .partner{padding:10px;gap:8px}
  .avatar{width:42px;height:42px}

  /* 健身统计 4 列窄屏更紧凑 */
  .fp-grid{gap:6px}
  .fp-cell{padding:8px 2px}
  .fp-cell .n{font-size:15px}

  /* 弹窗内边距 + 标题适配 */
  .sheet{padding:20px 14px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{font-size:15px}

  /* 适度缩小超大标题，避免拥挤 */
  .splash-greet{font-size:21px}
  .core .big{font-size:21px}
  .ai-score{font-size:27px}
  .ai-donut,.ai-hero-donut{width:92px;height:92px}

  /* 设置页体重双列、许愿/礼物网格更紧凑 */
  .weight-row{gap:8px}
  .row-btns{gap:8px}
}

</style>
</head>

<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="splash-illust" id="splashIllust"></div>
    <div class="splash-date" id="splashDate"></div>
    <div class="splash-sub">呆呆的你 配甜甜的我 🎀</div>
    <button class="splash-btn" data-act="enterApp">进入恋爱小窝 →</button>
  </div>
</div>

<div class="shell" id="appShell" style="display:none">
  <aside class="sidebar" id="sidebar">
    <button class="sb-toggle" data-act="sbToggle" aria-label="折叠/展开导航">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="sb-user" id="sbUser"></div>
    <nav class="nav" id="navList"></nav>
    <div class="sb-foot">
      <a class="nav-item" data-act="nav" data-view="mine">
        <span class="ic" id="mineIcon"></span>
        <span class="lab">设置</span>
      </a>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-act="closeSidebar"></div>
  <main class="content" id="content">
    <div class="content-inner">
      <div class="ptr" id="ptr"><span class="spin"></span><span id="ptrText">下拉刷新</span></div>
      <header class="page-header" id="pageHeader"></header>
      <div class="topbar" id="topbarHome"><div class="couples" id="couples"></div></div>
      <div id="banner"></div>
      <div class="today" id="today"></div>
      <main id="view"></main>
    </div>
  </main>
</div>

function solarToLunar(d){
 const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
 let offset=Math.round((new Date(y,m,day).getTime()-new Date(1900,0,31).getTime())/86400000);
 let i=1900,temp=0;
 for(;i<2101&&offset>0;i++){temp=daysInLunarYear(i);offset-=temp;}
 if(offset<0){offset+=temp;i--;}
 const lYear=i,leap=leapMonth(lYear);let isLeap=false,lMonth=1;
 for(i=1;i<13&&offset>0;i++){
  if(leap>0&&i===(leap+1)&&!isLeap){--i;isLeap=true;temp=leapDays(lYear);}
  else{temp=monthDays(lYear,i);}
  if(isLeap&&i===(leap+1))isLeap=false;
  offset-=temp;if(!isLeap)lMonth++;
 }
 if(offset===0&&leap>0&&i===leap+1){if(isLeap)isLeap=false;else{isLeap=true;--lMonth;}}
 if(offset<0){offset+=temp;--lMonth;}
 const lDay=offset+1;
 return {year:lYear,month:lMonth,day:lDay,isLeap,monthStr:(isLeap?'闰':'')+MONTH_CN[lMonth-1]+'月',dayStr:DATE_CN[lDay-1],ganZhi:ganZhi(lYear)};
}

function mergeData(base,inc){

      if(k==='meta'){out.meta=Object.assign({},base.meta,inc.meta);out.meta.me=base.meta.me;out.meta.theme=base.meta.theme;}

    if(Array.isArray(inc[k])&&inc[k].length&&inc[k][0]&&inc[k][0].id!==undefined){
      const map={};(base[k]||[]).forEach(r=>{if(r&&r.id!=null)map[r.id]=r;});

    if(d===0)rows.push({t:`今天是 ${esc(a.title)} 🎉`,s:a.note||"",over:false,view:"anniversary"});
    else if(d<= (a.notifyDays||7))rows.push({t:`${esc(a.title)} 还有 ${d} 天`,s:a.note||"",over:false,view:"anniversary"});});
  DATA.emotions.filter(e=>e.type==="fight"&&e.status==="notok").forEach(e=>{rows.push({t:`上次吵架还没和好`,s:esc(e.trigger||e.content||''),over:true,view:"emotion"});});
  predictPeriod();
  if(DATA.period.predictNext){const d=diffDays(DATA.period.predictNext,todayStr());if(d<=3&&d>=-1)rows.push({t:`毛毛经期预计 ${d<=0?'今天/已到':('还有'+d+'天')}`,s:"双方多照顾她～",over:d<=0,view:"period"});}
  return rows;
}
function renderToday(){$("#today").classList.add('hidden');$("#today").innerHTML='';}

/* ---------- module 2 纪念日 ---------- */
function viewAnniversary(){
  const list=DATA.anniversaries.map(a=>{const nd=nextOcc(a.date);const d=diffDays(nd,todayStr());
    const icon=annIcon(a.title);
    return `<div class="anni-item"><div class="ad">${d===0?'<b>今</b>':`<b>${d}</b><span>天</span>`}</div>
      <div class="ab"><div class="title-row"><span class="title-main"><span class="ic">${icon}</span><span class="t">${esc(a.title)}</span></span></div><div class="s"><span style="white-space:nowrap">下次：<b>${esc(nd)}</b></span></div>${a.note?`<div class="s" style="opacity:.75;font-size:11px">${esc(a.note)}</div>`:''}</div>
      <div class="act"><button class="iconbtn" data-act="editAnn" data-id="${a.id}">${ICON.edit}</button>
      <button class="iconbtn" data-act="delAnn" data-id="${a.id}">${ICON.trash}</button></div></div>`;}).join('')||`<div class="empty">还没有纪念日，添加一个吧～</div>`;
  $("#view").innerHTML=`<div class="fade"><div class="card">${cardCorner()}<h2>${ICON.cal} 纪念日 & 倒计时 <span class="h-deco">${ICON.pawSmall}</span></h2>${list}
    <div class="row-btns"><button class="btn full" data-act="addAnn">${ICON.plus} 新增纪念日</button></div></div></div>`;
}

/* ---------- module 3 礼物 ---------- */
function giftIcon(s){const x=s||'';if(/生日/.test(x))return '🎂';if(/结婚/.test(x))return RING_ICON;if(/情人|纪念/.test(x))return ANN_ICON;if(/约会/.test(x))return DATE_ICON;if(/圣诞|节|礼物/.test(x))return '🎁';return '🎀';}
function viewGifts(){
  const gs=DATA.gifts;
  const toCat=gs.filter(g=>g.toWho==='cat').length;
  const toDog=gs.filter(g=>g.toWho==='dog').length;
  const list=gs.slice().reverse().map(g=>{
    const thumb=g.photo?`<img class="g-thumb" src="${g.photo}" alt="礼物" onclick="zoomImg('${g.photo}')" style="cursor:zoom-in">`:`<div class="g-ic">${giftIcon(g.scene)}</div>`;
    return `<div class="gift-card">
      <div class="g-media">${thumb}</div>
      <div class="g-body">
        <div class="g-name">${esc(g.name||g.scene)} <span class="tag ${g.toWho==='cat'?'cat':'dog'}">给${whoName(g.toWho)}</span></div>
        <div class="g-scene">${esc(g.scene||'')}${g.date?` · ${esc(g.date)}`:''}</div>
        ${g.feeling?`<div class="g-feel">${esc(g.feeling)}</div>`:''}
      </div>
      <div class="act"><button class="iconbtn" data-act="editGift" data-id="${g.id}">${ICON.edit}</button>
      <button class="iconbtn" data-act="delGift" data-id="${g.id}">${ICON.trash}</button></div>
    </div>`;}).join('')||`<div class="g-empty"><div class="g-e-ic">🎁</div><div class="g-e-tx">还没有礼物记录<br><span>把每一次心动都存进来吧</span></div></div>`;
  $("#view").innerHTML=`<div class="fade"><div class="card">${cardCorner()}<h2>${ICON.gift} 礼物记录本 <span class="h-deco">${ICON.pawSmall}</span></h2>
    <div class="g-stats">
      <div class="g-stat"><div class="n">${gs.length}</div><div class="l">份礼物</div></div>
      <div class="g-stat cat"><div class="n">${toCat}</div><div class="l">给${whoName('cat')}</div></div>
      <div class="g-stat dog"><div class="n">${toDog}</div><div class="l">给${whoName('dog')}</div></div>
    </div>
    ${list}
    <div class="row-btns"><button class="btn full" data-act="addGift">${ICON.plus} 记一笔礼物</button></div></div></div>`;
}

/* ---------- module 4 合照墙 (时间轴瀑布流) ---------- */
function pImgs(p){return (p.imgs&&p.imgs.length)?p.imgs:(p.src?[p.src]:[]);}
function viewPhotos(){
  const tsOf=p=>(p.ts)||((p.when||p.date||'')+'T'+(p.time||'00:00'));
  const sorted=DATA.photos.slice().sort((a,b)=>new Date(tsOf(b))-new Date(tsOf(a)));
  const moments=sorted.length?sorted.map(p=>{
    const arr=pImgs(p);
    const dateStr=p.when||p.date||'未知';
    const timeStr=p.time||'';
    const upTag=p.uploader?`<span class="up-tag ${p.uploader}">${p.uploader==='cat'?'🐱 毛毛':'🐶 小赵'} 上传</span>`:'';
    const scenes=p.scene?`<span class="tag" style="background:var(--bg-paper);color:var(--ink)">${esc(p.scene)}</span>`:'';
    const places=p.place?`<span class="tag" style="background:var(--bg-paper);color:var(--ink)">📍 ${esc(p.place)}</span>`:'';
    const cells=arr.map((src,idx)=>`<div class="moment-cell"><img src="${src}" alt="" title="${esc(p.scene||'')}" onclick="zoomImg('${src}')" style="cursor:zoom-in">
      <div class="moment-cap">${esc(p.scene||'')}</div>
      ${arr.length>1?`<button class="del" data-act="delPhotoImg" data-id="${p.id}" data-idx="${idx}" title="删除这张">${ICON.trash}</button>`:''}</div>`).join('');
    const headRight=(upTag||scenes||places)?`<div class="moment-tags">${upTag}${scenes}${places}</div>`:'';
    return `<div class="moment"><div class="moment-head"><div class="moment-when"><span class="md">${esc(dateStr)}</span>${timeStr?`<span class="mt">${esc(timeStr)}</span>`:''}</div>${headRight}</div><div class="moment-grid">${cells}</div>
      <div class="moment-tools"><button class="iconbtn" data-act="editPhoto" data-id="${p.id}" title="编辑">${ICON.edit}</button><button class="iconbtn" data-act="delPhoto" data-id="${p.id}" title="删除">${ICON.trash}</button></div></div>`;
  }).join(''):'';
  $("#view").innerHTML=`<div class="fade"><div class="card">${cardCorner()}<h2><svg viewBox="0 0 32 32" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;flex:none"><rect x="5" y="9" width="22" height="16" rx="3"/><path d="M10 9l3-3h6l3 3"/><circle cx="16" cy="17" r="4"/><path d="M22 12h2"/></svg> 合影墙 <span class="h-deco">${ICON.pawSmall}</span></h2>
    <div class="moments">${moments||'<div class="ph-empty"><div class="cam">📷</div>还没有合照，点下方按钮记录你们的甜蜜瞬间吧～</div>'}</div>
    <div class="row-btns"><button class="btn full" data-act="addPhoto">${ICON.plus} 上传合影</button></div>
    <input type="file" id="photoFile" accept="image/*" multiple class="hidden" data-file="photo"></div></div>`;
}

/* ---------- module 5 愿望清单 ---------- */
function viewWishes(){
  const catColor=c=>({'旅行':'#5B7CC0','美食':'#BA7517','体验':'#7F77DD','居家':'#5F7A50','其他':'#8A8A8A'})[c]||'#8A8A8A';
  const list=DATA.wishes.map(w=>{const db=w.doneBy||[];const done=db.includes('cat')&&db.includes('dog');const n=db.length;
    const marks=db.map(p=>`<span class="tag ${p}">${whoName(p)}✓</span>`).join(' ');
    const col=catColor(w.category);
    const cs=w.checkins||{};let A=Object.keys(cs).map(k=>({who:k,src:cs[k]}));if(!A.length&&w.checkin)A=[{who:'',src:w.checkin}];
    const checkinImgs=A.map(p=>`<div class="wi-checkin-wrap"><img class="wi-checkin" src="${p.src}" alt="打卡图" onclick="zoomImg('${p.src}')" style="cursor:zoom-in"><span class="wi-who">${p.who?whoName(p.who):''}</span></div>`).join('');
    const slot=who=>`<div class="wi-slot ${db.includes(who)?'on':''}">${db.includes(who)?whoName(who)+' ✓':whoName(who)}</div>`;
    const statusPill=done?'<span class="tag ok">已共同解锁</span>':(n>0?`<span class="tag info">${n}/2 已打卡</span>`:'<span class="tag">待解锁</span>');
    const meDone=db.includes(DATA.meta.me);
    const partnerDone=db.includes(DATA.meta.me==='cat'?'dog':'cat');
    let statusText='',actionHTML='';
    if(done){statusText='两人已共同解锁';actionHTML=`<div class="wi-act"><span class="wi-act-status">${statusText}</span><div class="wi-act-btns"><button class="iconbtn" data-act="delWish" data-id="${w.id}" title="删除">${ICON.trash}</button></div></div>`;}
    else if(db.length>0){statusText=meDone?`等待${whoName(DATA.meta.me==='cat'?'dog':'cat')}打卡`:`等待${whoName(DATA.meta.me==='cat'?'dog':'cat')}打卡`;actionHTML=`<div class="wi-act"><span class="wi-act-status">${statusText}</span><div class="wi-act-btns"><button class="iconbtn wi-check" data-act="toggleWish" data-id="${w.id}" title="${meDone?'换图打卡':'打卡'}">${ICON.check}</button><button class="iconbtn" data-act="delWish" data-id="${w.id}" title="删除">${ICON.trash}</button></div></div>`;}
    else{statusText='等待两人一起打卡';actionHTML=`<div class="wi-act"><span class="wi-act-status">${statusText}</span><div class="wi-act-btns"><button class="iconbtn" data-act="editWish" data-id="${w.id}" title="编辑">${ICON.edit}</button><button class="iconbtn wi-check" data-act="toggleWish" data-id="${w.id}" title="打卡">${ICON.check}</button><button class="iconbtn" data-act="delWish" data-id="${w.id}" title="删除">${ICON.trash}</button></div></div>`;}
    const actions=actionHTML;
    return `<div class="item wish-item ${done?'done':''}">
      <div class="wi-body">
        <div class="wi-top"><div class="wi-t">${esc(w.title)}</div>${statusPill}</div>
        ${w.note?`<div class="wi-note">${esc(w.note)}</div>`:''}
        <div class="wi-cat"><span class="tag" style="color:${col};border-color:${col}55;background:${col}18">${esc(w.category||'其他')}</span></div>
        <div class="wi-slots">${slot('cat')}${slot('dog')}</div>
        ${checkinImgs?`<div class="wi-checkins">${checkinImgs}</div>`:''}
        ${w.feeling?`<div class="s wi-feel">${esc(w.feeling)}</div>`:''}
        ${actions}
      </div></div>`;}).join('')||`<div class="empty">写下你们想一起做的事～</div>`;
  const doneCount=DATA.wishes.filter(w=>{const db=w.doneBy||[];return db.includes('cat')&&db.includes('dog');}).length;
  const pct=DATA.wishes.length?Math.round(doneCount/DATA.wishes.length*100):0;
  const isComplete=pct===100;
  const prog=DATA.wishes.length?`<div class="unlock-prog ${isComplete?'complete':''}">
  <div class="up-shine"></div><div class="up-decor a"></div><div class="up-decor b"></div>
  <div class="up-top"><span class="up-lock">${isComplete?'🔓':'🔒'}</span><div class="up-meta"><div class="up-t">${isComplete?'✨ 全部共同解锁':'共同解锁进度'}</div><div class="up-s">毛毛 &amp; 小赵 一起解锁了 <b>${doneCount}</b> / ${DATA.wishes.length} 个愿望</div></div>${isComplete?'':`<span class="up-pct">${pct}<small>%</small></span>`}</div>
  <div class="bar up-bar"><i style="width:${pct}%" class="${isComplete?'glow':''}"></i></div>
  <div class="up-foot">${isComplete?'你们完成了所有共同愿望，太甜啦！':'每个愿望都需要两个人一起打卡，才算共同解锁哦 🔑'}</div>
  ${isComplete?'<div class="up-badge">🎉 全部解锁</div>':''}
</div>`:'';
  $("#view").innerHTML=`<div class="fade"><div class="card">${cardCorner()}<h2><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAAQAElEQVR4AexdCZgU1bU+p5oZYEBHUEJEogN0VWuMRmG6XRBBQeOLS2LMRja3RH1PfclTEhMRNW7R55LlqdH44hKNMTFPEzUb4G6idM+AAUPo6h4YjKKIGzsMXXXeubMgM9Mzfau6q2vpW1/frq5b5557zn/vX3ep6lsaBGRrakp+2DCmHBWPN89QISwYHHa4rjdPDEgV8sQMXwgSjx82XteTZxpG8taEkXzB0JPvD63HNxBiz8c07WkVwoIBvaih1pYwUsRl+EpCT/5I15uPgwhtVSWIYSRnMoiPxTT6l4Z4NwKeD4BTEbER1BZqBLgMDwTEbzJh5ht66rWEnrpmwoRD9wu1U2x8VQiSmJhqTujJp5kQCxnEkzlf9YkwAoiwDyDMra+razeM1B+4VZkVVnc9JUhTU9MwJsaPKUZpQJwRVpCU3e4RQIBPcquywNCTvxo//ojR7jX5k9IzgsTjzYcOrR/zMhPjP5E3f9xTuQYFAa4CX2wYXlgRjyenB8UmGTs8IYhhNJ/PY4wXATABalMIdCPAJBkT03ChrifP6I4K/K7iBDHiqWsRtFsZjKGgNoVAfwSG8MXzHsNIXtz/VPBiKkoQXW8+FzW4NHhuKouChgAC3mRwTyNodvW1p2IESUxKnsBO/7RvBupYITAQAsg9DZ7lOhUCvFWEIBMnpgyI4cPcrcKq+KoyiQwCSPRAYkJzIqgOVYQgdTF4kB0cycHN5z0iehRs+qpNNB07OiZkzTSqEHwMLNueTEDnENi3cBn+y03h8yxnAw3RHnWVtgqJyiaIrqfOA4Qpzm2lZQzsbCbCaDOX+Uw2n3kgl8s8t6L95XbnulQKPxDI51uWmGbmLtNsuZjLcF+b7M8C0N+c2oIIB+h6co7TdNWQL4sg48ZNadCQrnFiKF9p1ovWImtmDjbNloecpFWywUYgl2v5v6yZmUoApzu1VEO4cr/9puztNJ3X8mURZORIPAsA9wQHG4N3imgtHCRRoiFDwDTTv4AdhY93XgylbccRw+pjji620qrLECyLIAiadLNIBK8XLJoqulEQ4E2ZVhkEsqsWL0ULZ3G5b5DVyBfPL02cOKVRVr4acq4JEo8nxUOH8k9rIsxua8s47p9WAwSVhzcIZFemW3h8epKsdh6LDIvFYrNl5ash55ogmoY8IJM0keBGbnafl5RWYhFCoLPciW6SdQmRuNsuK+29nGuC8A0PqRs8oh+6w7Ku9d4VlUNgEdA2XMWzW2/K2IeAyXj80DEystWQcUUQvvs5jY3bjUPpD8EtK1e2ri8tqCSiikA2m93IM5dzZf1DrEvJynot54ogYEOzrGEWwT2yshGXq2n33l2/5TeyAHA3K9wEYQfkbgwSLeaBubs7rLJoKrlQILBu3fJNQDBfylhCufolpaw8IXctCMABMtnaQAtk5JRMbSAgWx/4ArxvUBBxRRBCHCXjAJKWl5FTMrWBACLK1gdHN5+9RM8VQRBgD5DYbLDflxBTIjWCgG3DVjlXcZycnPdSrgjCZkm1IJqmFVhWfTxHIBwZaBpJ14fx448YHgSvXBKEOmSM53sgLvXLaFcyUUZg2DC7Lgj+qQochFJQNgQWAUWQwBaNMiwICCiCBKEUlA2BRSAwBNH1yQck9OTvE0aKohIMPXmnYUzZK7ClL2NYjcsEgiC6nrxKwyHLAfGUKJUHz/ufA3wvSNebQ7s2bZTKw40vvhOEK89sDXGeG+PDkIZJ0oiAv21qOkTq3lEYfKolG30nCFeeb0cdcEGSurr6r0bdzyj65ytBxoz56EiuPIdGEdi+PmlAkXqxTF//onrsK0Hq6obbUQW2r18E8JG+cbV+H /* ---------- module 6 经期 ---------- */
function predictPeriod(){if(!DATA.period.lastStart){DATA.period.predictNext="";return;}
  const b=new Date(DATA.period.lastStart+'T00:00');b.setDate(b.getDate()+(DATA.period.cycle||28));DATA.period.predictNext=dstr(b);}
function cyclePhaseInfo(){
  const p=DATA.period;
  if(!p.lastStart) return null;
  const cycle=Math.max(21,Math.min(40,+p.cycle||28));
  const today=todayStr();
  const start=new Date(p.lastStart+'T00:00');
  const now=new Date(today+'T00:00');
  const dayDiff=Math.floor((now-start)/86400000);
  if(dayDiff<0) return null;
  const periodLen=p.lastEnd?Math.max(1,diffDays(p.lastEnd,p.lastStart)+1):5;
  const ovulationIndex=cycle-14;
  const dayIndex=dayDiff%cycle;
  let phase,label,color,desc,rangeText;
  if(dayIndex<periodLen){
    phase='menstrual';label='月经期';color:'#F4A9C4';desc='多喝热水，注意保暖休息';rangeText=`第 ${dayIndex+1}/${periodLen} 天`;
  }else if(dayIndex<ovulationIndex){
    phase='follicular';label='卵泡期';color:'#B8D6C8';desc='状态回升，适合运动';rangeText=`第 ${dayIndex+1} 天`;
  }else if(dayIndex===ovulationIndex){
    phase='ovulation';label='排卵日';color:'#D4B8E8';desc='易孕期，注意避孕或备孕';rangeText=`周期第 ${dayIndex+1} 天`;
  }else{
    phase='luteal';label='黄体期';color:'#F2D5A3';desc='情绪易波动，多给她包容';rangeText=`第 ${dayIndex+1}/${cycle} 天`;
  }
  return {phase,label,color,desc,rangeText,dayIndex,cycle,periodLen,ovulationIndex,totalDay:dayDiff+1};
}
function cycleRingSvg(info){
  const {cycle,periodLen,ovulationIndex,phase}=info;
  const r=50,c=2*Math.PI*r;
  const parts=[
    {key:'menstrual',name:'月经期',color:'#F4A9C4',len:periodLen},
    {key:'follicular',name:'卵泡期',color:'#B8D6C8',len:ovulationIndex-periodLen},
    {key:'ovulation',name:'排卵日',color:'#D4B8E8',len:1},
    {key:'luteal',name:'黄体期',color:'#F2D5A3',len:cycle-ovulationIndex-1}
  ];
  let svg=`<svg viewBox="0 0 130 130" style="width:150px;height:150px;margin:0 auto;display:block;transform:rotate(-90deg)">`;
  svg+=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="#F3E7EA" stroke-width="9"/>`;
  let offset=0;
  parts.forEach(pt=>{
    if(pt.len<=0) return;
    const dash=pt.len/cycle*c;
    const gap=c-dash;
    const isCurrent=phase===pt.key;
    svg+=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="${pt.color}" stroke-width="${isCurrent?11:8}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" stroke-linecap="${isCurrent?'round':'butt'}" ${isCurrent?`style="color:${pt.color};animation:breathe 2.6s ease-in-out infinite"`:''}/>`;
    offset+=dash;
  });
  svg+=`<circle cx="65" cy="65" r="37" fill="#FFFFFF" opacity=".72"/>`;
  svg+=`</svg>`;
  return svg;
}
function viewPeriod(){
  predictPeriod();const p=DATA.period;
  const info=cyclePhaseInfo();
  const phaseColors=['#F4A9C4','#B8D6C8','#D4B8E8','#F2D5A3'];

function fitCalories(type,duration,who){
  const metMap={'跑步':9.8,'跑':9.8,'游泳':8,'力量训练':5,'力量':5,'瑜伽':3,'骑行':7.5,'单车':7.5,'自行车':7.5,'步行':3.5,'走路':3.5,'散步':3.5,'跳绳':10,'HIIT':8,'有氧':6};
  const base=(type||'').trim();
  let met=6;
  for(const k in metMap){if(base.indexOf(k)>=0){met=metMap[k];break;}}
  const w=(who==='dog'?DATA.meta.dog.weight:DATA.meta.cat.weight)||(who==='dog'?65:50);
  return Math.round(met*w*(duration/60));
}
function updateKcalHint(){
  const who=($('#f_who_v')&&$('#f_who_v').value)||DATA.meta.me;
  const dur=+($('#f_dur')&&$('#f_dur').value)||0;
  const type=($('#f_type')&&$('#f_type').value)||'运动';
  const kcal=fitCalories(type,dur,who);
  const hint=$('#f_kcal_hint');
  if(hint)hint.textContent=`预计消耗约 ${kcal} kcal（按 ${whoName(who)} ${who==='dog'?DATA.meta.dog.weight:DATA.meta.cat.weight}kg 估算）`;
}
function fitStats(who){
  const m=todayStr().slice(0,7);
  const month=DATA.fitness.filter(f=>f.who===who&&f.date&&f.date.startsWith(m));
  const monthDur=month.reduce((s,f)=>s+(+f.duration||0),0);
  const monthKcal=month.reduce((s,f)=>s+(f.calories!=null?f.calories:fitCalories(f.type,f.duration,f.who)),0);
  const daySet=new Set(DATA.fitness.filter(f=>f.who===who&&f.date).map(f=>f.date));
  let streak=0;const cur=new Date();while(daySet.has(dstr(cur))){streak++;cur.setDate(cur.getDate()-1);}
  return {count:month.length,dur:monthDur,kcal:monthKcal,streak};
}
function fitPersonCard(who,emoji){
  const s=fitStats(who);
  return `<div class="fit-person ${who}">
    <div class="fp-head"><div class="fp-ava">${emoji}</div><div class="fp-name">${whoName(who)}</div><div class="fp-sub">本月</div></div>

      <div class="fp-cell"><div class="n">${s.streak}<span class="u">天</span></div><div class="l">连续</div></div>
    </div>
  </div>`;
}

/* ---------- module 9 AI 月报（本地关系分析，设备端生成，数据不出本机） ---------- */
let AI_VIEW_MONTH=null;
function winRange(){const now=new Date();const y=now.getFullYear(),mo=now.getMonth();const from=new Date(y,mo,1);const to=new Date(y,mo+1,0);return {from,to,fromS:dstr(from),toS:dstr(to),month:dstr(now).slice(0,7)};}
function inWin(ds){if(!ds)return false;try{const d=new Date(String(ds).slice(0,10)+'T00:00');const r=winRange();return d>=r.from&&d<=r.to;}catch(e){return false;}}
function clamp(n,a,b){return Math.max(a,Math.min(b,n||0));}

function analyzeRelationship(){
  const r=winRange();
  const photos=DATA.photos.filter(p=>inWin(p.when||p.date||p.ts)).length;
  const sweets=DATA.emotions.filter(e=>e.type==='sweet'&&inWin(e.date)).length;
  const fights=DATA.emotions.filter(e=>e.type==='fight'&&inWin(e.date));
  const fightN=fights.length;
  const reconcileN=fights.filter(e=>e.status==='ok').length;
  const reviews=DATA.emotions.filter(e=>inWin(e.date)).reduce((n,e)=>n+((e.reviews&&Object.values(e.reviews).filter(x=>x&&String(x).trim()).length)||0),0);
  const gifts=DATA.gifts.filter(g=>inWin(g.date)).length;
  const fitnessN=DATA.fitness.filter(f=>inWin(f.date)).length;
  const unlocks=DATA.wishes.filter(w=>{const db=w.doneBy||[];return db.includes('cat')&&db.includes('dog');}).length;

  const dims={
    intimacy: clamp(Math.round(photos*10+sweets*6+gifts*5),0,100),
    sweetness: clamp(Math.round(sweets*10+gifts*8+photos*4),0,100),
    communication: clamp(Math.round(reviews*9+reconcileN*12+sweets*3),0,100),
    growth: clamp(Math.round(fitnessN*7+unlocks*8),0,100),
    harmony: clamp(Math.round(100-fightN*22+reconcileN*10),10,100),
  };
  const overall=Math.round(dims.intimacy*.22+dims.sweetness*.22+dims.communication*.2+dims.growth*.18+dims.harmony*.18);

  let headline,emoji;
  if(overall>=85){headline='感情状态极佳，甜度爆表';emoji='💕';}
  else if(overall>=72){headline='稳定又甜蜜，相处很舒服';emoji='😊';}
  else if(overall>=58){headline='总体平稳，还有升温空间';emoji='🌿';}
  else {headline='最近有点淡，多制造点小浪漫吧';emoji='💭';}

  const insights=[];
  if(photos>0)insights.push(`过去 30 天一起留下了 <b>${photos}</b> 张合影，亲密互动在线 📷`);
  else insights.push(`最近 30 天没有新合影，可以约一次「出门拍照日」📷`);
  if(sweets>0)insights.push(`记录了 <b>${sweets}</b> 个甜蜜瞬间，记得多收藏这些小确幸 ✨`);
  else insights.push(`别吝啬记录甜蜜，随手在「心情记」里存一笔「甜蜜瞬间」吧 ✨`);
  if(reviews>0)insights.push(`你们做了 <b>${reviews}</b> 次「我的复盘」，沟通意识很棒 👍`);
  else insights.push(`很少做复盘，遇到小事试着各写一句「我的复盘」📝`);
  if(fightN>0)insights.push(`这段时间有 <b>${fightN}</b> 次小摩擦，其中 <b>${reconcileN}</b> 次已和好——吵架后主动靠近很重要 🤝`);
  else insights.push(`这段时间没有记录吵架，氛围很和睦 🕊️`);
  if(gifts>0)insights.push(`互送了 <b>${gifts}</b> 份礼物，仪式感拉满 🎁`);
  if(fitnessN>0)insights.push(`一起运动 <b>${fitnessN}</b> 次，共同成长看得见 💪`);
  if(unlocks>0)insights.push(`已共同解锁 <b>${unlocks}</b> 个愿望，继续把清单清空吧 🔓`);

  const dimList=[
    {k:'intimacy',label:'亲密指数',tip:'约一次出门合影日，哪怕只是街角咖啡馆。'},
    {k:'sweetness',label:'甜蜜指数',tip:'互相准备一个小惊喜或手写便利贴。'},
    {k:'communication',label:'沟通指数',tip:'每周做一次「我的复盘」，把心里话说出来。'},
    {k:'growth',label:'共同成长',tip:'挑一个共同愿望去打卡，一起完成更有成就感。'},
    {k:'harmony',label:'和睦指数',tip:'吵架后先主动给个台阶，一个拥抱胜过千言。'},
  ];
  const sortedDims=dimList.slice().sort((a,b)=>dims[a.k]-dims[b.k]);
  const suggestions=sortedDims.slice(0,2).map(d=>`<b>${d.label}</b>：${d.tip}`);
  if(overall>=85)suggestions.unshift('保持现在的节奏，把平淡的日子也过成诗 🌸');

  const report={month:r.month,from:r.fromS,to:r.toS,score:overall,emoji,headline,
    dims,metrics:{photos,sweets,fightN,reconcileN,reviews,gifts,fitnessN,unlocks},
    insights,suggestions,genAt:Date.now()};
  DATA.aiReports=DATA.aiReports||[];
  const idx=DATA.aiReports.findIndex(x=>x.month===r.month);
  if(idx>=0)DATA.aiReports[idx]=report; else DATA.aiReports.push(report);
  if(DATA.aiReports.length>24)DATA.aiReports=DATA.aiReports.slice(-24);
  save();
  return report;
}

function scoreDonut(score){
  const R=54,C=2*Math.PI*R,off=C*(1-score/100);
  return `<svg viewBox="0 0 150 150" class="ai-donut">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="#F1E3E8" stroke-width="13"/>
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="url(#aiGrad)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 75 75)"/>
    <defs><linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9B8CD"/><stop offset="1" stop-color="#EC8FA8"/></linearGradient></defs>
    <text x="75" y="70" text-anchor="middle" class="ai-score">${score}</text>
    <text x="75" y="92" text-anchor="middle" class="ai-score-u">综合分</text>
  </svg>`;
}

function radarSvg(dims){
  const keys=['intimacy','sweetness','communication','growth','harmony'];
  const labels=['亲密','甜蜜','沟通','成长','和睦'];
  const cx=120,cy=120,R=80,N=5;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,val)=>{const rr=R*val/100;return [cx+rr*Math.cos(ang(i)),cy+rr*Math.sin(ang(i))];};
  let grid='';
  [0.25,0.5,0.75,1].forEach(g=>{const p=keys.map((_,i)=>pt(i,100*g).map(v=>v.toFixed(1)).join(',')).join(' ');grid+=`<polygon points="${p}" fill="none" stroke="#EFDDE4" stroke-width="1"/>`;});
  let axes='',labs='';
  keys.forEach((k,i)=>{const [x,y]=pt(i,100);axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#F1E3E8" stroke-width="1"/>`;const [lx,ly]=pt(i,108);labs+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" class="ai-rl">${labels[i]}</text>`;});
  const dp=keys.map((k,i)=>pt(i,dims[k]).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=keys.map((k,i)=>{const [x,y]=pt(i,dims[k]);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#EC8FA8"/>`;}).join('');
  return `<svg viewBox="0 0 240 240" class="ai-radar">${grid}${axes}<polygon points="${dp}" fill="rgba(236,143,168,.28)" stroke="#EC8FA8" stroke-width="2"/>${dots}${labs}</svg>`;
}

function scoreColor(s){return s>=85?'#4F8B7C':s>=72?'#6B9E8E':s>=58?'#C78D45':'#D96E92';}
function dimLegend(dims){
  const map=[{k:'intimacy',l:'亲密',c:'#F9B8CD'},{k:'sweetness',l:'甜蜜',c:'#F4A9C4'},{k:'communication',l:'沟通',c:'#9DBBD5'},{k:'growth',l:'成长',c:'#C9B6E4'},{k:'harmony',l:'和睦',c:'#FBD89E'}];
  return map.map(x=>`<div class="di"><span class="di-dot" style="background:${x.c}"></span><span class="di-l">${x.l}</span><b>${dims[x.k]}</b></div>`).join('');
}
function viewAI(){
  const r=winRange();
  const cur=DATA.aiReports.find(x=>x.month===r.month);
  let report;
  if(AI_VIEW_MONTH){report=DATA.aiReports.find(x=>x.month===AI_VIEW_MONTH)||cur;}
  if(!report)report=cur||analyzeRelationship();
  const m=report.metrics;
  const totalEvents=m.photos+m.sweets+m.fightN+m.reviews+m.gifts+m.fitnessN+m.unlocks;
  const isSparse=totalEvents<3;

  const prevSorted=DATA.aiReports.filter(x=>x.month<report.month).sort((a,b)=>a.month.localeCompare(b.month));
  const prev=prevSorted.length?prevSorted[prevSorted.length-1]:null;
  let trendHtml;
  if(prev){const diff=report.score-prev.score;trendHtml=`<span class="ai-trend ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff)} 分</span>`;}
  else{trendHtml=`<span class="ai-trend first">首月月报</span>`;}

  const metrics=[
    {icon:'📷',label:'合影',n:m.photos,color:'#F9B8CD'},
    {icon:'✨',label:'甜蜜',n:m.sweets,color:'#F4A9C4'},
    {icon:'📝',label:'复盘',n:m.reviews,color:'#9DBBD5'},
    {icon:'🎁',label:'礼物',n:m.gifts,color:'#FBD89E'},
    {icon:'💪',label:'运动',n:m.fitnessN,color:'#C9B6E4'},
    {icon:'🔓',label:'解锁',n:m.unlocks,color:'#B8D8C8'}
  ];
  const chipHtml=metrics.map(c=>`<div class="ai-chip"><span class="ai-chip-dot" style="background:${c.color}"></span><span class="ai-chip-n">${c.n}</span><span class="ai-chip-l">${c.label}</span></div>`).join('');

  const insightCards=report.insights.map((t,i)=>{
    const icons=['📷','✨','📝','🤝','🎁','💪','🔓','🌸'];
    return `<div class="ai-insight-card"><span class="ai-insight-ic">${icons[i%icons.length]}</span><div class="ai-insight-txt">${t}</div></div>`;
  }).join('');

  const focus=report.suggestions[0]||'';
  const moreSugs=report.suggestions.slice(1).map(t=>`<li>${t}</li>`).join('');

  const hist=DATA.aiReports.filter(x=>x.month!==report.month).slice().reverse();
  const histHtml=hist.length?`<div class="ai-hist"><div class="ai-hist-t">往期月报</div>${hist.map(h=>`<button class="ai-hist-item" data-act="aiHistory" data-month="${h.month}"><span class="ai-hist-m">${h.month}</span><span class="ai-hist-s" style="background:${scoreColor(h.score)}22;color:${scoreColor(h.score)}">${h.score} 分</span><span class="ai-hist-h">${h.emoji} ${esc(h.headline)}</span></button>`).join('')}</div>`:'';
